# Markers of the Lab 2 circles (the same ring as lab2_circle_ccw): the course frame of course.yaml beside this file.
# Imported once from course.yaml (marker_survey's marker_map_import);
# `just lab2 survey` replaces the list with the measured boards. The
# layout, its reasons and the tape marks are in course.yaml.
version: 1
frame_id: map                 # the frame the robot's map uses
dictionary: DICT_5X5_1000     # printed family
marker_size: 0.38             # [m] edge of the black square, measured
mount: wall                   # default for every marker below
markers:
  - {id: 24, x: 0.000, y:  0.000, z: 0.250, facing_deg:    0.000000}
  - {id: 25, x: 1.750, y: -3.031, z: 0.250, facing_deg:   60.000140}
  - {id: 26, x: 5.250, y: -3.031, z: 0.250, facing_deg:  120.000281}
  - {id: 27, x: 7.000, y:  0.000, z: 0.250, facing_deg:  180.000421}
  - {id: 28, x: 5.250, y:  3.031, z: 0.250, facing_deg: -120.000281}
  - {id: 29, x: 1.750, y:  3.031, z: 0.250, facing_deg:  -60.000140}
