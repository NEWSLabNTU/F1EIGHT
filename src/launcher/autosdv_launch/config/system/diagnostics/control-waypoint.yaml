# Control for the waypoint lab: control-pursuit.yaml (the coach lab's, whose
# notes below still apply) with one change. trajectory_follower does not run;
# path_tracker publishes on its topic, so the rate check stands, but its
# control_state diagnostic is replaced by path_tracker's own tracker_state:
# ERROR once the student law is disabled after repeated faults, OK otherwise.
#
# From control-pursuit.yaml: the stock control.yaml without lane_departure
# (needs the lanelet map) and emergency_braking (needs perception's obstacle
# cloud). The lab control component launches neither, so their checks would
# stay STALE and block autonomous forever.
#
# Local and remote (manual) modes are explicitly unavailable: they drive the
# gate's EXTERNAL input through external_cmd_converter, which the lab control
# component does not launch. The stock units checked the selector's heartbeat
# and the converter's input rate; with no converter the second would only ever
# be STALE, so the modes say what they are instead. The selector still runs
# (the transition manager needs it to engage AUTONOMOUS); its heartbeat unit
# stays defined below, linked into no mode, for rqt_diagnostics_graph_monitor.
units:
  - path: /autoware/control
    type: and
    list:
      - { type: link, link: /autoware/control/topic_rate_check/trajectory_follower }
      - { type: link, link: /autoware/control/topic_rate_check/control_command }
      - { type: link, link: /autoware/control/node_alive_monitoring/command_gate }
      - { type: link, link: /autoware/control/performance_monitoring/control_state }

  - path: /autoware/control/node_alive_monitoring/command_gate
    type: or
    list:
      - { type: link, link: /autoware/control/node_alive_monitoring/vehicle_cmd_gate }
      - { type: link, link: /autoware/control/node_alive_monitoring/control_command_gate }

  - path: /autoware/control/local
    type: error

  - path: /autoware/control/remote
    type: error

  - path: /autoware/control/topic_rate_check/trajectory_follower
    type: diag
    node: topic_state_monitor_trajectory_follower_control_cmd
    name: control_topic_status

  - path: /autoware/control/topic_rate_check/control_command
    type: diag
    node: topic_state_monitor_control_command_control_cmd
    name: control_topic_status

  - path: /autoware/control/node_alive_monitoring/vehicle_cmd_gate
    type: diag
    node: vehicle_cmd_gate
    name: heartbeat

  - path: /autoware/control/node_alive_monitoring/control_command_gate
    type: diag
    node: control_command_gate
    name: timeout_output

  - path: /autoware/control/performance_monitoring/control_state
    type: diag
    node: path_tracker
    name: tracker_state

  - path: /autoware/control/topic_rate_check/external_cmd_selector
    type: diag
    node: external_cmd_selector
    name: heartbeat
