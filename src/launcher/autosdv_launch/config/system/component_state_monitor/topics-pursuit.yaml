# Component state monitor topics for the coach-pursuit lab (Lab 2).
# Read by diagnostics/autosdv-pursuit-main.yaml. Derived from autoware_launch's
# topics.yaml: the map, NDT/EKF, Autoware perception and route entries are
# dropped (the lab runs none of them), and three lab entries are added --
# kinematic_state (dead reckoning alive), coach_state (tracker alive) and
# coach_board (detection rate, informational).

- module: planning
  mode: [online, logging_simulation, planning_simulation]
  type: autonomous
  args:
    node_name_suffix: scenario_planning_trajectory
    topic: /planning/trajectory
    topic_type: autoware_planning_msgs/msg/Trajectory
    best_effort: false
    transient_local: false
    warn_rate: 5.0
    error_rate: 1.0
    timeout: 1.0

- module: control
  mode: [online, logging_simulation, planning_simulation]
  type: autonomous
  args:
    node_name_suffix: trajectory_follower_control_cmd
    topic: /control/trajectory_follower/control_cmd
    topic_type: autoware_control_msgs/msg/Control
    best_effort: false
    transient_local: false
    warn_rate: 5.0
    error_rate: 1.0
    timeout: 1.0

- module: control
  mode: [online, logging_simulation, planning_simulation]
  type: autonomous
  args:
    node_name_suffix: control_command_control_cmd
