/**:
  ros__parameters:
    laps: 0              # 0: the course's own (course.yaml)
    v_max: 1.0           # [m/s] cap on every waypoint speed: the hall is small
    decel: 0.3           # [m/s^2] the end-of-run stop ramp
    spacing: 0.1         # [m] the course is resampled to this
    window_behind: 1.0   # [m] trajectory window behind the car
    window_ahead: 6.0    # [m] and ahead of it
    rate: 10.0
