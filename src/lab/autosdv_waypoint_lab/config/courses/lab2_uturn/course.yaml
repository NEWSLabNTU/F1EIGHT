# Lab 2 graded route: the U-TURN (one bag, 45 of the team's 60 points: speed
# error on the straight legs and in the turn, overshoot, stop error).
#
# GENERATED by `just lab2 make-uturn 1.1 --leg 2 --write`
# (scripts/testing/lab2/make_uturn.py, autosdv_waypoint_lab/uturn.py). To change
# the radius or the legs, run that again with the new numbers; do not edit
# this file, path.csv or the map by hand.
#
# Route: from the start box, straight 2 m driving +x, a RIGHT U-turn of
# radius 1.1 m, straight 2 m back driving -x in the other lane; the legs
# are 2.2 m apart, centre to centre. One run at v_ref 0.8 m/s, open
# path; the path publisher's end ramp (decel 0.3 m/s^2) brings the car to
# rest on the last waypoint, which is the graded stop point. Path length
# 7.45 m; the turn is s = 2.00 to 5.45 m along it
# (the grader splits straight from turn by arc length, read from path.csv).
#
# Frame: the START-BOX frame `just aruco-map align` writes -- origin on the
# floor at the start box (base_link: the rear axle centre), x along the first
# leg (the way the car drives off), y to the car's left, z up. A right turn
# from +x goes to -y, so the second leg runs at y = -2R.
#
# Tape marks (rear axle for the car):
#   start box    (0.00, 0.00), car pointing +x along the first leg
#   turn centre  (2.00, -1.10); apex (3.10, -1.10)
#   stop line    (0.00, -2.20): level with the start box, in the other lane
# Floor: x -2.5 to 5.0, y -5.5 to 0.5 (route and boards), clear.
#
# Boards (DICT_5X5_1000, 0.4667 m black square on a 600 mm board standing on
# the floor, so the marker centre is 0.3 m up), measured from the start box. 4 boards:
#   id 24  (  4.50,  0.00)  facing -x       ANCHOR  in view at s = 0.0-2.5 m
#   id 25  (  4.50, -1.50)  facing +120 deg         in view at s = 0.0-3.2 m
#   id 26  (  1.50, -5.00)  facing +15 deg          in view at s = 3.2-4.9 m
#   id 27  ( -2.00, -2.50)  facing +15 deg          in view at s = 4.5-7.5 m
# Why 4: a coverage search (marker_sim.visible: hfov 100 deg, range 5 m =
# ar_tag distance_threshold, 60 deg incidence limit, 0.4667 m marker) over
# boards on a 0.5 m grid facing every 15 deg, each at least 1.4 m from
# the car's track (1 m clear of the car), for the fewest that give: the start box
# (+-0.3 m, +-10 deg) sees >= 2 boards; no blind stretch over 3 m;
# a board in view through the whole turn; a car at rest near the stop line
# (+-0.3 m, +-10 deg) sees >= 1, so the stop is measured on a fix.
# 4 is the fewest the search tries.
# Result: the start box sees >= 2 boards, the stop >= 1; a board in view on
# 100% of the path (two or more on 42%); the turn covered on
# 100%; the longest blind stretch 0.00 m (s = 0.0
# to 0.0 m), 0.0 s at 0.8 m/s, under localization_monitor's
# 5 s error_age.
#
# Setting up (docs/guides/lab2-waypoint-stack.md, "On the field"): tape the
# route, place the boards by the table above, measured from the start box (a
# few cm off is fine: the survey measures them), survey them with any board as
# the origin (`just aruco-map scan ID`; 24, the ANCHOR, faces the first leg),
# then `just aruco-map align` with the car in the start box, driven straight
# along the taped first leg. That writes the measured boards in THIS frame beside
# this path.csv and start_pose, so the route lies where the tape is. The ids are
# placeholders (24 is a real board id); the survey writes the ids the
# boards actually carry.
path: path.csv
closed: false
laps: 1
v_ref: 0.8
start_pose: {x: 0.000, y: 0.000, yaw: 0.0000}
marker_size: 0.4667
dictionary: DICT_5X5_1000
# 600 mm board standing on the floor, the 0.4667 m black square centred on it
marker_height: 0.3
# what make-uturn generated this course from (the tests read it; the stack does not)
uturn: {radius: 1.1, leg: 2}
markers:
  - {id: 24, x: 4.500, y: 0.000, yaw: 3.1416}
  - {id: 25, x: 4.500, y: -1.500, yaw: 2.0944}
  - {id: 26, x: 1.500, y: -5.000, yaw: 0.2618}
  - {id: 27, x: -2.000, y: -2.500, yaw: 0.2618}
