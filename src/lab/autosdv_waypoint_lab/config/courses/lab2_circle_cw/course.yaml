# Lab 2 grading route 2 of 3: the CLOCKWISE CIRCLE, R = 1.5 m (bag 2; with
# the other circle, 25 pts: steady-window speed RMSE and start overshoot per
# circle; radius error <= 0.3 m, 3 laps and no MRM are a pass/fail gate).
# A closed path driven 3 laps at v_ref 0.8 m/s.
#
# Floor: about 8 m x 8 m, clear. The two circles (R 1.5 m clockwise, R 2.5 m
# counter-clockwise; the other is lab2_circle_ccw) are concentric and share
# the one ring of boards below, so one layout and one survey serve both bags.
#
# Frame: the course frame `just lab2 survey` writes -- origin on the floor
# below the ORIGIN BOARD's marker centre, x the way that board faces, y to
# its left, z up. The origin board is the ring board at (0, 0) facing +x
# (id 24 here), so the circle centre C is at (3.5, 0).
#
# Boards (DICT_5X5_1000, 0.38 m black square on a 500 mm plate standing on
# the floor, so the marker centre is 0.25 m up): 6 boards on a ring of
# radius 3.5 m about C, every 60 deg, each facing C. Seen from C, with +x as
# east: west (the origin, at (0, 0)), south-west, south-east, east,
# north-east, north-west. Why 6: a coverage simulation (marker_sim.visible,
# hfov 100 deg, range 5 m = ar_tag distance_threshold, 60 deg incidence limit,
# 0.38 m marker) over both circles says 5 is the minimum that keeps a board in
# view all the way round on both; 4 leaves blind gaps of up to 0.44 m. 6 gives
# one spare: two boards in view for about 40% of the lap.
#
# Tape marks:
#   centre       C = (3.5, 0)
#   start box    (3.5, -1.5): the car's rear axle on the circle, due south of
#                C, the car pointing -x (the origin board's side of the ring ahead)
#   optional     a few marks on the R 1.5 m circle, to judge a run by eye
#
# Setting up: place the ring as above, survey with the origin board as the
# origin (`just lab2 survey <copy of this dir> <origin board id>`), and keep
# path.csv and start_pose: the survey replaces only `markers`,
# `marker_size`, `dictionary` and `survey`, so a ring laid out as this
# file says stays consistent with the measured boards. One recording serves
# both circles: solve it again into the other directory with
#   ros2 run autosdv_marker_survey lab2_marker_survey_solve \
#       <this dir>/survey_data.npz --course <the other dir>
# The ids below are placeholders (24 is a real board id); the survey
# writes the ids the boards actually carry.
path: path.csv
closed: true
laps: 3
v_ref: 0.8
start_pose: {x: 3.500, y: -1.500, yaw: 3.1416}
marker_size: 0.38
dictionary: DICT_5X5_1000
# 500 mm plate standing on the floor, the 0.38 m black square centred on it
marker_height: 0.25
markers:
  - {id: 24, x: 0.000, y: 0.000, yaw: 0.0000}
  - {id: 25, x: 1.750, y: -3.031, yaw: 1.0472}
  - {id: 26, x: 5.250, y: -3.031, yaw: 2.0944}
  - {id: 27, x: 7.000, y: 0.000, yaw: 3.1416}
  - {id: 28, x: 5.250, y: 3.031, yaw: -2.0944}
  - {id: 29, x: 1.750, y: 3.031, yaw: -1.0472}
