launch:
# Logging Simulation Launch File
# This launch file is used for replaying rosbags with Autoware stack
# It uses sim_time and disables sensor drivers (data comes from rosbag)

- arg:
    name: is_simulation
    default: "true"
    description: "Enable simulation mode (disables PWM output to hardware)"

# AutoSDV: map_path was hardcoded to ./data/COSS-map-planning below (not an
# overridable arg), which made it impossible to point pose_source:=mcl (or
# any pose source) at a different map directory - e.g. the sample-site map
# used by the 2D-MCL Phase 3/4 gates - from the command line. Exposed as an
# arg, default unchanged, so every existing invocation resolves identically.
# AutoSDV: data_path was hardcoded to /opt/autoware/1.5.0/data, which the
# Debian package owns as root. Every TensorRT node writes its compiled .engine
# NEXT TO the .onnx it built from, so in a root-owned directory that write
# fails, the work is discarded, and the same models are rebuilt — and fail —
# on every launch. `just setup-autoware-data` mirrors that tree into
# data/autoware_data with symlinks, which is what this now points at.
# Override with the argument, or with AUTOSDV_DATA_PATH in the environment.
- arg:
    name: data_path
    default: "$(env AUTOSDV_DATA_PATH ./data/autoware_data)"
    description: "Autoware model/artifact directory. Must be writable, or TensorRT cannot cache its engines."

- arg:
    name: map_path
    default: "./data/COSS-map-planning"
    description: "Map directory path, forwarded to autosdv_map_component (Task 1); must contain occupancy_grid.yaml for pose_source:=mcl"

# AutoSDV: occupancy_grid_file was not forwarded from this top-level launch
# at all (see autosdv_autoware.launch.xml's own arg comment for the full
# rationale and the Task 8 numbers). Default unchanged (occupancy_grid.yaml,
# deliberately neutral -- see docs/reports/2dlidar-phase5-mcl-pose-source.md);
# name occupancy_grid_file:=occupancy_grid_scanaccum_mh1r05.yaml explicitly
# for Phase 4's validated accuracy on the sample site.
- arg:
    name: occupancy_grid_file
    default: "occupancy_grid.yaml"
    description: "2-D occupancy grid metadata file name within map_path (pose_source:=mcl only)"

# AutoSDV: particle_filter's RNG seed (pose_source:=mcl only). The param
# file ships -1 (nondeterministic), which is right for operation but makes an
# accuracy matrix unreproducible -- the phase-5 matrix labelled its runs
# "seed N" while never applying a seed at all. Exposed here so a matrix can
# set one per run; default unchanged.
- arg:
    name: mcl_random_seed
    default: "-1"
    description: "particle_filter RNG seed (pose_source:=mcl only); -1 = nondeterministic"

# AutoSDV: LiDAR topic feeding the localization util chain for ndt/cuda_ndt.
# The default suits a live sensing pipeline; a replayed bag usually carries a
# single decoded cloud instead, e.g.
# input_pointcloud:=/sensing/lidar/top/pointcloud_raw_ex for the Autoware
# sample bag. Not used by pose_source:=mcl, which has its own input argument.
- arg:
    name: input_pointcloud
    default: "/sensing/lidar/concatenated/pointcloud"
    description: "LiDAR topic feeding the localization util chain (ndt/cuda_ndt)"

# AutoSDV: LiDAR topic feeding perception (obstacle segmentation -> occupancy
# grid). Same replay problem as input_pointcloud, a different module: the stock
# perception component hard-wires the concatenated cloud, so a replayed bag
# leaves behavior_path_planner waiting on an occupancy grid that never comes.
- arg:
    name: perception_input_pointcloud
    default: "/sensing/lidar/concatenated/pointcloud"
    description: "LiDAR topic feeding perception (ground/obstacle segmentation)"

# AutoSDV: the vehicle and sensor models a replayed bag was recorded with.
# Hardcoded to the AutoSDV pair until now, which silently mismatches a foreign
# bag: the Autoware sample rosbag was recorded on sample_vehicle
# (vehicle_height 2.5 m) whereas autosdv_vehicle is 0.262 m, and the obstacle
# crop box spans ground-2.5 .. vehicle_height, so every point above ~26 cm was
# discarded. crop_box_filter then ran on each frame while emitting an empty
# cloud, so ground segmentation, the occupancy grid, and hence
# behavior_path_planner (stuck at "waiting for occupancy_grid") produced
# nothing -- no path, no trajectory, no control command.
#
# Pair these with the bag: COSS bags with the AutoSDV vehicle (the defaults),
# the Autoware sample rosbag with sample_vehicle + sample_sensor_kit.
# The calibration set the replay's URDF reads (individual_params/config/<vehicle_id>/
# <sensor_model>). `default`, not a car: it is the one instance that also carries
# sample_sensor_kit for the Autoware sample bag. Name the car that recorded a bag
# (vehicle_id:=car_b) to replay it with that car's calibration. launch_vehicle_interface:=true
# needs a car: `default` has no autosdv_vehicle/actuator.param.yaml, so the interface refuses.
- arg:
    name: vehicle_id
    default: "default"
    description: "individual_params instance for the replayed bag's calibration: default, car_a, car_b, car_c"
- arg:
    name: vehicle_model
    default: "autosdv_vehicle"
    description: "vehicle model the replayed bag was recorded with"
- arg:
    name: sensor_model
    default: "autosdv_sensor_kit"
    description: "sensor model the replayed bag was recorded with"

# Sensor Suite Configuration
- arg:
    name: sensor_suite
    default: "vlp32c_zed_imu"
    description: "Predefined sensor suite: robin_zed, robin_zed_mpu, vlp32c_zed, vlp32c_zed_mpu, vlp32c_zed_imu, cube1_usb, custom"

# Individual Sensor Parameters (override suite defaults when sensor_suite=custom)
- arg:
    name: lidar_model
    default: ""
    description: "LiDAR model (cube1, robin-w, vlp16, or vlp32c) - empty string uses suite default"

- arg:
    name: camera_model
    default: ""
    description: "Camera model (zedxm, usb, or none) - empty string uses suite default"

- arg:
    name: imu_source
    default: ""
    description: "IMU source (mpu9250, zed) - empty string uses suite default"

- arg:
    name: gnss_receiver
    default: ""
    description: "GNSS receiver type (ublox, septentrio, or garmin) - empty string uses suite default"

- arg:
    name: use_gnss
    default: ""
    description: "Enable GNSS for outdoor operation - empty string uses suite default"

- arg:
    name: launch_system_monitor
    default: "true"
    description: "Launch autosdv_system_monitor (measured at up to 25% of a core on Jetson; disable on CPU-constrained vehicles)"

- arg:
    name: use_ntrip
    default: "false"
    description: "Enable NTRIP client for RTK corrections (disabled in simulation)"

# Exposed include arguments. Every one of these was a hardcoded value at its
# include, which silently ate any name:=value given on the command line -- the
# trap that hit data_path and rviz_config. Defaults preserve the previous
# hardcoded behavior exactly.
- arg:
    name: use_sim_time
    default: "true"
    description: "Use simulated clock (rosbag replay)"

- arg:
    name: rviz_config
    default: "$(find-pkg-share autosdv_launch)/rviz/autosdv.rviz"
    description: "RViz layout to load"

- arg:
    name: system_run_mode
    default: "logging_simulation"
    description: "Autoware system run mode"

- arg:
    name: launch_vehicle
    default: "true"
    description: "Launch vehicle model"

- arg:
    name: launch_vehicle_interface
    default: "false"
    description: "Launch the real vehicle interface (off: replayed bags carry its topics)"

- arg:
    name: launch_system
    default: "true"
    description: "Launch system module"

- arg:
    name: launch_dummy_diag_publisher
    default: "false"
    description: "Launch dummy diagnostics publisher"

- arg:
    name: launch_map
    default: "true"
    description: "Launch map loading"

- arg:
    name: launch_sensing
    default: "true"
    description: "Launch sensing"

- arg:
    name: launch_sensing_driver
    default: "false"
    description: "Launch sensor drivers (off: data comes from the bag)"

- arg:
    name: launch_localization
    default: "true"
    description: "Launch localization"

# Distinct from launch_system_monitor above: that one gates AutoSDV's own
# monitor node; this one is Autoware's system_monitor stack at the include.
- arg:
    name: launch_autoware_system_monitor
    default: "false"
    description: "Launch Autoware's system monitor stack"

- arg:
    name: use_mapless_mode
    default: "false"
    description: "Enable mapless mode for indoor operation without localization"

- arg:
    name: pose_source
    default: "cuda_ndt"
    description: "Pose estimation source: cuda_ndt (default, CUDA NDT), ndt (built-in Autoware CPU NDT), mcl (2-D Monte Carlo against an occupancy grid)"

- arg:
    name: pose_source_package
    default: "auto"
    description: "Package providing launch/pose_estimator.launch.xml. 'auto' derives it from pose_source (cuda_ndt -> cuda_ndt_matcher_launch, anything else -> built-in Autoware NDT). Set explicitly only to plug in a third-party estimator; use pose_source:=ndt for built-in NDT (ros2 launch rejects an empty value)"

# CUDA point cloud pipeline. Two independent whole-stage switches; neither can
# be half-applied, because each stage's nodes hand each other cuda_blackboard
# device pointers rather than data. See docs/design/cuda-pipeline-data-flow.md.
- arg:
    name: pointcloud_backend
    default: "cpu"
    description: "cpu or cuda: sensing-side point cloud preprocessing (crop-self, deskew, ring outlier). cuda needs a per-point time offset, so it applies to lidar_model:=vlp16, vlp32c, and robin-w, not cube1"
- arg:
    name: localization_pointcloud_backend
    default: "cpu"
    description: "cpu or cuda: the NDT input chain (crop box, voxel grid, random downsample). Correctness verified, speed not yet measured"

# Resolve 'auto' into a concrete package name. Without this, pose_source_package
# defaulted to cuda_ndt_matcher_launch regardless of pose_source, and because the
# selector in pose_twist_estimator.launch.xml splits pose_source on underscores
# ('cuda_ndt' -> {'cuda','ndt'}), pose_source:=ndt silently ran the CUDA plugin
# too -- contradicting its documented "built-in Autoware NDT" meaning.
- let:
    name: resolved_pose_source_package
    value: "$(eval \"('cuda_ndt_matcher_launch' if '$(var pose_source)' == 'cuda_ndt' else '') if '$(var pose_source_package)' == 'auto' else '$(var pose_source_package)'\")"

- arg:
    name: enable_zed_object_detection
    default: ""
    description: "Enable ZED camera object detection - empty string uses suite default"

# Preset Configuration
- arg:
    name: perception_preset
    default: "lidar_only"
    description: "Perception preset: lidar_only, camera_lidar_fusion, minimal"

- arg:
    name: localization_preset
    default: "default"
    description: "Localization preset: default, eagleye"

# Include perception preset (defines perception_mode, use_traffic_light_recognition, etc.)
- include:
    file: "$(find-pkg-share autosdv_launch)/config/perception/preset/$(var perception_preset)_preset.yaml"

# Include localization preset (defines twist_source)
- include:
    file: "$(find-pkg-share autosdv_launch)/config/localization/preset/$(var localization_preset)_preset.yaml"

# Logging simulation specific parameters
- arg:
    name: launch_perception
    default: "true"
    description: "Launch perception module"

- arg:
    name: launch_planning
    default: "true"
    description: "Launch planning module"

- arg:
    name: launch_control
    default: "true"
    description: "Launch control module"

- arg:
    name: rviz
    default: "true"
    description: "Launch RViz"

- include:
    file: "$(find-pkg-share autosdv_launch)/launch/autosdv_autoware.launch.xml"
    arg:
    -
      name: vehicle_id
      value: $(var vehicle_id)
    -
      name: vehicle_model
      value: $(var vehicle_model)
    -
      name: is_simulation
      value: $(var is_simulation)
    -
      name: sensor_model
      value: $(var sensor_model)
    -
      name: map_path
      value: $(var map_path)
    -
      name: occupancy_grid_file
      value: $(var occupancy_grid_file)
    -
      name: mcl_random_seed
      value: $(var mcl_random_seed)
    -
      name: input_pointcloud
      value: $(var input_pointcloud)
    -
      name: perception_input_pointcloud
      value: $(var perception_input_pointcloud)
    -
      name: data_path
      value: $(var data_path)
    -
      name: launch_vehicle
      value: $(var launch_vehicle)
    -
      name: launch_vehicle_interface
      value: $(var launch_vehicle_interface)
    -
      name: launch_system
      value: $(var launch_system)
    -
      name: system_run_mode
      value: $(var system_run_mode)
    -
      name: launch_system_monitor
      value: $(var launch_autoware_system_monitor)
    -
      name: launch_dummy_diag_publisher
      value: $(var launch_dummy_diag_publisher)
    -
      name: launch_map
      value: $(var launch_map)
    -
      name: launch_sensing
      value: $(var launch_sensing)
    -
      name: launch_sensing_driver
      value: $(var launch_sensing_driver)
    -
      name: launch_localization
      value: $(var launch_localization)
    -
      name: launch_perception
      value: $(var launch_perception)
    -
      name: launch_planning
      value: $(var launch_planning)
    -
      name: launch_control
      value: $(var launch_control)
    -
      name: perception_mode
      value: $(var perception_mode)
    -
      name: use_traffic_light_recognition
      value: $(var use_traffic_light_recognition)
    -
      name: traffic_light_recognition/enable_fine_detection
      value: "false"
    -
      name: use_detection_by_tracker
      value: $(var use_detection_by_tracker)
    -
      name: use_image_segmentation_based_filter
      value: $(var use_image_segmentation_based_filter)
    -
      name: use_pointcloud_map
      value: $(var use_pointcloud_map)
    -
      name: use_sim_time
      value: $(var use_sim_time)
    -
      name: rviz
      value: $(var rviz)
    -
      name: rviz_config
      value: $(var rviz_config)
    -
      name: pose_source
      value: $(var pose_source)
    -
      name: pose_source_package
      value: $(var resolved_pose_source_package)
    -
      name: localization_pointcloud_backend
      value: $(var localization_pointcloud_backend)
    -
      name: pointcloud_backend
      value: $(var pointcloud_backend)
    -
      name: twist_source
      value: $(var twist_source)
    -
      name: lidar_model
      value: $(var lidar_model)
    -
      name: camera_model
      value: $(var camera_model)
    -
      name: imu_source
      value: $(var imu_source)
    -
      name: gnss_receiver
      value: $(var gnss_receiver)
    -
      name: use_gnss
      value: $(var use_gnss)
    -
      name: use_ntrip
      value: $(var use_ntrip)
    -
      name: enable_zed_object_detection
      value: $(var enable_zed_object_detection)
    -
      name: sensor_suite
      value: $(var sensor_suite)
    -
      name: use_mapless_mode
      value: $(var use_mapless_mode)

# System Monitor. Gated: measured at up to 25% of a core on Jetson.
- include:
    file: "$(find-pkg-share autosdv_system_monitor)/launch/autosdv_system_monitor.launch.yaml"
    if: $(var launch_system_monitor)
