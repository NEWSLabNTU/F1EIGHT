# AutoSDV vehicle: per-user TurboVNC settings, ~/.vnc/turbovncserver.conf.
# Installed by the setup step `turbovnc-xstartup`; read after
# /etc/turbovncserver.conf, so these win.
#
# TurboVNC 3.x does not look for ~/.vnc/xstartup.turbovnc on its own -- its
# default is the stock script in /opt/TurboVNC/bin, which cannot start GNOME on
# the vehicle. This points every `vncserver` at ours.

$xstartup = "$ENV{HOME}/.vnc/xstartup.turbovnc";
$geometry = "1920x1080";
