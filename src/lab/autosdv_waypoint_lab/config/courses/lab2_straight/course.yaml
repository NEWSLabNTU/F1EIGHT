# Lab 2 grading route 1 of 3: the STRAIGHT (bag 1, 20 pts: steady-window
# speed RMSE, start overshoot, stop error). An open 10 m path driven once at
# v_ref 0.8 m/s; the path publisher's end ramp (decel 0.3 m/s^2) brings the
# car to rest on the last waypoint, which is the graded stop point.
#
# Floor: about 14 m x 3 m, clear: the route spans x = 1.5 to 11.5, the car
# starts about 1 m behind that (the start box rear axle at 11.5, nose at
# about 12) and the end board stands at x = 0, plus margin.
#
# Frame: the course frame `just lab2 survey` writes -- origin on the floor
# below the ORIGIN BOARD's marker centre, x the way that board faces, y to
# its left, z up. The origin board is the END board (id 24 here): it stands
# at x = 0 facing +x, i.e. facing the car, which drives -x towards it.
#
# Boards (DICT_5X5_1000, 0.38 m black square on a 500 mm plate standing on
# the floor, so the marker centre is 0.25 m up). Three boards. Seen from the
# start box, looking down the route (-x), the car's left is -y:
#   end board     (0.0, 0.0)   facing +x, square to the route   -> origin
#   front-left    (6.8, -1.0)  yaw +30 deg, angled at the car
#   front-right   (6.8, +1.0)  yaw -30 deg, angled at the car
# A side board square to the route is seen only from the side, and too late.
# Why these: a coverage simulation (marker_sim.visible, hfov 100 deg, range
# 5 m = ar_tag distance_threshold, 60 deg incidence limit, 0.38 m marker)
# along the route says the start box (+-0.3 m, +-10 deg) always sees both side
# boards, so the car has a
# fix before it moves. The one blind stretch is x = 8.14 to 5.2 (2.94 m, about
# 3.7 s at 0.8 m/s), under localization_monitor's error_age of 5 s; after it
# the end board is in range. Boards only at the far end would leave the start
# box with no fix and a blind stretch of about 6 m.
#
# Tape marks, measured from the origin board along the route centreline:
#   start box    x = 11.5 (the car's rear axle), car pointing -x at the board
#   stop line    x = 1.5 (rear axle), 1.5 m short of the end board
#
# Setting up: place the boards as above, survey with the end board as the
# origin (`just lab2 survey <copy of this dir> <end board id>`), and keep
# path.csv and start_pose: the survey writes marker_map.yaml and leaves this
# file alone, so a course laid out as this file says stays consistent with
# the measured boards. The ids in marker_map.yaml are placeholders (24 is a
# real board id); the survey writes the ids the boards actually carry, and
# the origin id is the one named on its command line.
path: path.csv
closed: false
laps: 1
v_ref: 0.8
start_pose: {x: 11.500, y: 0.000, yaw: 3.1416}
