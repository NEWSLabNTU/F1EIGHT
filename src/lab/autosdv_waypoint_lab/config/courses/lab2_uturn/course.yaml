# Lab 2 graded route: the U-TURN (one bag, 45 of the team's 60 points: speed
# error on the straight legs and in the turn, overshoot, stop error).
#
# GENERATED by `just lab2 make-uturn 1.5 --leg 10 --write`
# (scripts/testing/lab2/make_uturn.py, autosdv_waypoint_lab/uturn.py). To change
# the radius or the legs, run that again with the new numbers; do not edit
# this file, path.csv or the map by hand.
#
# Route: from the start box, straight 10 m driving -x, a RIGHT U-turn of
# radius 1.5 m, straight 10 m back driving +x in the other lane; the legs
# are 3 m apart, centre to centre. One run at v_ref 0.8 m/s, open
# path; the path publisher's end ramp (decel 0.3 m/s^2) brings the car to
# rest on the last waypoint, which is the graded stop point. Path length
# 24.71 m; the turn is s = 10.00 to 14.71 m along it
# (the grader splits straight from turn by arc length, read from path.csv).
#
# Frame: the course frame `just lab2 survey` writes -- origin on the floor
# below the ORIGIN BOARD's marker centre, x the way that board faces, y to
# its left, z up. The origin board (id 24) stands on the out leg's line,
# 1.00 m beyond the turn's apex, facing +x (at the car on the out
# leg). It cannot stand nearer the turn and stay 1.4 m clear of it,
# which is why the route starts at x = 12.5.
#
# Tape marks (rear axle for the car):
#   start box    (12.50, 0.00), car pointing -x, at the origin board
#   turn centre  (2.50, 1.50); apex (1.00, 1.50)
#   stop line    (12.50, 3.00): level with the start box, in the other lane
# Floor: x -0.5 to 15.0, y -2.0 to 5.0 (route and boards), clear.
#
# Boards (DICT_5X5_1000, 0.38 m black square on a 500 mm plate standing on
# the floor, so the marker centre is 0.25 m up). 8 boards:
#   id 24  (  0.00,  0.00)  facing +x       ORIGIN  in view at s = 7.4-10.8 m
#   id 25  (  8.00,  1.50)  facing +x               in view at s = 0.0-2.7 m
#   id 26  (  9.00, -1.50)  facing +x               in view at s = 0.0-1.7 m
#   id 27  (  4.50, -1.50)  facing +x               in view at s = 3.1-6.3 m
#   id 28  (  0.00,  4.50)  facing -60 deg          in view at s = 10.6-12.8 m
#   id 29  (  5.50,  4.50)  facing +165 deg         in view at s = 12.9-15.9 m
#   id 30  ( 10.00,  4.50)  facing -105 deg         in view at s = 17.3-20.4 m
#   id 31  ( 14.50,  3.50)  facing +165 deg         in view at s = 21.6-24.7 m
# Why 8: a coverage search (marker_sim.visible: hfov 100 deg, range 5 m =
# ar_tag distance_threshold, 60 deg incidence limit, 0.38 m marker) over
# boards on a 0.5 m grid facing every 15 deg, each at least 1.4 m from
# the car's track (1 m clear of the car), for the fewest that give: the start box
# (+-0.3 m, +-10 deg) sees >= 2 boards; no blind stretch over 3 m;
# a board in view through the whole turn; a car at rest near the stop line
# (+-0.3 m, +-10 deg) sees >= 1, so the stop is measured on a fix.
# The search found no layout of 7 that meets all four.
# Result: the start box sees >= 2 boards, the stop >= 1; a board in view on
# 85% of the path (two or more on 8%); the turn covered on
# 100%; the longest blind stretch 1.30 m (s = 15.9
# to 17.2 m), 1.6 s at 0.8 m/s, under localization_monitor's
# 5 s error_age.
#
# Setting up: place the boards as above, survey with the origin board as the
# origin (`just lab2 survey <copy of this dir> <origin board id>`), and keep
# path.csv and start_pose: the survey replaces only `markers`, `marker_size`,
# `dictionary` and `survey`, so a course laid out as this file says stays
# consistent with the measured boards. The ids are placeholders (24 is a
# real board id); the survey writes the ids the boards actually carry.
path: path.csv
closed: false
laps: 1
v_ref: 0.8
start_pose: {x: 12.500, y: 0.000, yaw: 3.1416}
marker_size: 0.38
dictionary: DICT_5X5_1000
# 500 mm plate standing on the floor, the 0.38 m black square centred on it
marker_height: 0.25
# what make-uturn generated this course from (the tests read it; the stack does not)
uturn: {radius: 1.5, leg: 10}
markers:
  - {id: 24, x: 0.000, y: 0.000, yaw: 0.0000}
  - {id: 25, x: 8.000, y: 1.500, yaw: 0.0000}
  - {id: 26, x: 9.000, y: -1.500, yaw: 0.0000}
  - {id: 27, x: 4.500, y: -1.500, yaw: 0.0000}
  - {id: 28, x: 0.000, y: 4.500, yaw: -1.0472}
  - {id: 29, x: 5.500, y: 4.500, yaw: 2.8798}
  - {id: 30, x: 10.000, y: 4.500, yaw: -1.8326}
  - {id: 31, x: 14.500, y: 3.500, yaw: 2.8798}
