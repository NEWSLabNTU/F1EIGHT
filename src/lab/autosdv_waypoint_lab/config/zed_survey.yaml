# ZED X Mini for the marker survey (launch/marker_survey.launch.xml): the
# rectified left image, and positional tracking (the SDK's visual-inertial
# odometry), which links the frames the markers are seen in. Tracking needs
# depth, so depth is computed (not published). Loaded after zed_wrapper's
# common_stereo.yaml and zedxm.yaml.
/**:
  ros__parameters:
    general:
      grab_resolution: 'HD1200'
      grab_frame_rate: 30
      pub_resolution: 'NATIVE'
      pub_frame_rate: 15.0
    video:
      publish_rgb: true
      publish_left_right: false
      publish_raw: false
      publish_gray: false
      publish_stereo: false
    depth:
      depth_mode: 'NEURAL_LIGHT'    # tracking is disabled with NONE
      point_cloud_freq: 0.0
      publish_depth_map: false
      publish_depth_info: false
      publish_point_cloud: false
      publish_depth_confidence: false
      publish_disparity: false
    pos_tracking:
      pos_tracking_enabled: true
      imu_fusion: true
      publish_tf: false              # the vehicle URDF owns the camera's place in TF
      publish_map_tf: false
      area_memory: false             # no loop-closure resets: the odometry must be continuous
      reset_odom_with_loop_closure: false
      set_gravity_as_origin: true
      two_d_mode: false
      publish_odom_pose: true
    mapping:
      mapping_enabled: false
    object_detection:
      od_enabled: false
    body_tracking:
      bt_enabled: false
    sensors:
      sensors_image_sync: false
      sensors_pub_rate: 100.0
      publish_imu: true
      publish_imu_tf: false
    # The wrapper publishes every topic BEST_EFFORT; the stock imu_corrector
    # subscribes RELIABLE, and a best-effort publisher never matches a reliable
    # subscriber: the topic ran at 100 Hz and /sensing/imu/imu_data stayed empty,
    # so gyro_odometer never produced a twist. The wrapper declares per-topic QoS
    # override parameters (QosOverridingOptions::with_default_policies); the key
    # is the fully resolved topic name.
    qos_overrides:
      /sensing/camera/zedxm/imu/data:
        publisher:
          reliability: reliable
