; RC override arbiter firmware. See README.md.
;
;   pio test -e native        host tests, no board
;   pio run -e xiao_rp2350    cross-compile for the board

[platformio]
default_envs = xiao_rp2350

; The official raspberrypi platform ships the Mbed core, which has no RP2350.
; maxgerhardt's fork wraps earlephilhower's arduino-pico, which defines the
; XIAO RP2350. Pinned to a commit so the toolchain does not move under us.
[env:xiao_rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = seeed_xiao_rp2350
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Warnings for our own code only; the NeoPixel library has its own.
build_src_flags = -Wall -Wextra
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5

; Host tests. PlatformIO builds only lib/ and test/ here, never src/, which is
; why everything that decides anything lives in lib/ without Arduino.h.
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_build_src = no
