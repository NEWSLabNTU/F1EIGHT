# Localization for the waypoint lab: Autoware's EKF fed by the AR-tag
# localizer and gyro_odometer. Three conditions, all required:
#   - /localization/kinematic_state keeps arriving (vehicle_cmd_gate withholds
#     output without it): a rate check from
#     ../component_state_monitor/topics-waypoint.yaml. ekf_localizer publishes
#     map -> base_link right after it in publish_estimate_result(), so this
#     also proves the transform alive; it is not rate-checked on /tf, where
#     topic_state_monitor's depth-1 queue under-counts it beside any frequent
#     /tf publisher;
#   - a marker fix was accepted within error_age (5 s): localization_monitor.
#     Between markers the EKF coasts on odometry, and a long coast is a stale
#     pose; before the first fix the pose is only the start box.
units:
  - path: /autoware/localization
    type: and
    list:
      - { type: link, link: /autoware/localization/topic_rate_check/kinematic_state }
      - { type: link, link: /autoware/localization/marker_fix }

  - path: /autoware/localization/topic_rate_check/kinematic_state
    type: diag
    node: topic_state_monitor_localization_kinematic_state
    name: localization_topic_status

  - path: /autoware/localization/marker_fix
    type: diag
    node: localization_monitor
    name: marker_fix
