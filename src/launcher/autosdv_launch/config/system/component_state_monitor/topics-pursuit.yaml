# No map -> base_link row. topic_state_monitor's /tf mode subscribes with a
# depth-1 queue and counts only messages carrying that pair, so any other
# frequent /tf publisher overwrites most of them before the callback runs (car
# B, 2026-10-16: the ZED IMU transform at 100 Hz, measured ~1 Hz against a real
# 20 Hz, engage refused). kinematic_state, below, is published in the same
# callback as that transform, so it is the liveness check; preflight still
# looks the transform up through tf2.
# AutoSDV lab: dead reckoning (or the simulator) is the only source of the
# odometry vehicle_cmd_gate waits for.
- module: localization
  mode: [online, logging_simulation, planning_simulation]
  type: autonomous
  args:
    node_name_suffix: localization_kinematic_state
    topic: /localization/kinematic_state
    topic_type: nav_msgs/msg/Odometry
    best_effort: false
    transient_local: false
    warn_rate: 5.0
    error_rate: 1.0
    timeout: 1.0

# AutoSDV lab: coach_tracker publishes CoachState at a fixed 20 Hz, valid or not.
- module: perception
  mode: [online, logging_simulation, planning_simulation]
  type: autonomous
  args:
    node_name_suffix: coach_state
    topic: /perception/coach/state
    topic_type: autosdv_lab_msgs/msg/CoachState
    best_effort: false
    transient_local: false
    warn_rate: 5.0
    error_rate: 1.0
    timeout: 1.0

# AutoSDV lab: board detections, ~10 Hz when the board is in view. Informational
# (/autoware/lab/coach_detection), not a gate; best_effort so it matches a
# detector publishing either way.
- module: perception
  mode: [online, logging_simulation, planning_simulation]
  type: launch
  args:
    node_name_suffix: coach_board
    topic: /perception/coach/board
    topic_type: geometry_msgs/msg/PoseStamped
    best_effort: true
    transient_local: false
    warn_rate: 5.0
    error_rate: 1.0
    timeout: 1.0
