# path_tracker: YOUR file. The car runs the TA's pure-pursuit tracker; the only
# thing a team tunes is how far ahead it looks:
#
#   L = clamp(k_lookahead * speed + lookahead_min, lookahead_min, lookahead_max)
#
# Everything else (rates, timeouts, the curvature speed limit) is the tracker's
# own default. Keep this file in your team directory, beside the controller
# (~/lab2/team<N>/path_tracker.param.yaml); `just lab2 vehicle` (and the gate with
# team:=DIR) merges these three settings into the tracker's file and refuses any
# other setting.
/**:
  ros__parameters:
    tracker:
      k_lookahead: 0.6     # [s] lookahead grows by this times speed
      lookahead_min: 0.6   # [m]
      lookahead_max: 2.0   # [m]
