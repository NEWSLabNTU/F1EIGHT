# Component state monitor topics for the waypoint lab (Lab 2).
# Read by diagnostics/autosdv-waypoint-main.yaml. The coach-pursuit lab's set
# (topics-pursuit.yaml) without its two coach entries: the trajectory, control,
# vehicle, emergency and map->base_link checks, and kinematic_state, which the
# EKF publishes here. Marker fixes are not a rate check: they arrive only
# while a marker is in view, so localization_monitor judges their age instead.

- module: planning
  mode: [online, logging_simulation, planning_simulation]
  type: autonomous
  args:
    node_name_suffix: scenario_planning_trajectory
    topic: /planning/trajectory
    topic_type: autoware_planning_msgs/msg/Trajectory
    best_effort: false
    transient_local: false
    warn_rate: 5.0
    error_rate: 1.0
    timeout: 1.0

- module: control
  mode: [online, logging_simulation, planning_simulation]
  type: autonomous
  args:
    node_name_suffix: trajectory_follower_control_cmd
    topic: /control/trajectory_follower/control_cmd
    topic_type: autoware_control_msgs/msg/Control
    best_effort: false
    transient_local: false
    warn_rate: 5.0
    error_rate: 1.0
    timeout: 1.0

- module: control
  mode: [online, logging_simulation, planning_simulation]
  type: autonomous
  args:
    node_name_suffix: control_command_control_cmd
    topic: /control/command/control_cmd
    topic_type: autoware_control_msgs/msg/Control
    best_effort: false
    transient_local: false
    warn_rate: 5.0
    error_rate: 1.0
